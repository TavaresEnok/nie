name: nie

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nie
      POSTGRES_PASSWORD: ${NIE_DB_PASSWORD:-nie}
      POSTGRES_DB: nie
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nie_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nie -d nie"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2024.11.2-46e3e55
    container_name: nie-searxng
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8082/
    restart: unless-stopped

  scrapy-worker:
    build:
      context: ./workers/scrapy_worker
      dockerfile: Dockerfile
    container_name: nie-scrapy-worker
    ports:
      - "127.0.0.1:8085:8085"
    # Conteúdo coletado é não confiável: teto de recursos e sem escalada de privilégio.
    mem_limit: ${NIE_SCRAPY_MEM_LIMIT:-512m}
    cpus: ${NIE_SCRAPY_CPUS:-1.0}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  crawl4ai-worker:
    build:
      context: ./workers/crawl4ai_worker
      dockerfile: Dockerfile
    container_name: nie-crawl4ai-worker
    profiles:
      - advanced
      - all
    ports:
      - "127.0.0.1:8086:8086"
    mem_limit: ${NIE_CRAWL4AI_MEM_LIMIT:-1536m}
    cpus: ${NIE_CRAWL4AI_CPUS:-1.5}
    pids_limit: 512
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${NIE_DOCKER_TARGET:-runtime}
    depends_on:
      postgres:
        condition: service_healthy
      scrapy-worker:
        condition: service_started
    environment:
      NIE_DATABASE_URL: postgres://nie:${NIE_DB_PASSWORD:-nie}@postgres:5432/nie?sslmode=disable
      NIE_ADDR: 0.0.0.0:8080
      NIE_DATA_DIR: /data
      NIE_WORKER: "true"
      NIE_WORKERS: ${NIE_WORKERS:-2}
      NIE_POLL_INTERVAL: ${NIE_POLL_INTERVAL:-2s}
      NIE_REQUEST_TIMEOUT: ${NIE_REQUEST_TIMEOUT:-30s}
      NIE_SEARXNG_URL: ${NIE_SEARXNG_URL:-http://searxng:8080}
      NIE_SCRAPY_URL: ${NIE_SCRAPY_URL:-http://scrapy-worker:8085}
      NIE_CRAWL4AI_URL: ${NIE_CRAWL4AI_URL:-http://crawl4ai-worker:8086}
      NIE_MWMBL_URL: ${NIE_MWMBL_URL:-https://mwmbl.org}
      NIE_WAYBACK_ENABLED: "true"
      NIE_SOFTWARE_HERITAGE_ENABLED: "true"
      NIE_MENTIONS_DISCOVERY_ENABLED: "true"
      NIE_AUTOMATIC_RESEARCH: ${NIE_AUTOMATIC_RESEARCH:-true}
      NIE_MAX_RESEARCH_ROUNDS: ${NIE_MAX_RESEARCH_ROUNDS:-3}
      NIE_OCR_ENABLED: ${NIE_OCR_ENABLED:-false}
      NIE_OCR_MAX_PAGES: ${NIE_OCR_MAX_PAGES:-10}
      NIE_OCR_LANGUAGE: ${NIE_OCR_LANGUAGE:-eng}
      NIE_OCR_TIMEOUT: ${NIE_OCR_TIMEOUT:-45s}
      NIE_GITHUB_ENABLED: ${NIE_GITHUB_ENABLED:-false}
      NIE_GITHUB_TOKEN: ${NIE_GITHUB_TOKEN:-}
      NIE_API_TOKEN: ${NIE_API_TOKEN:-}
      NIE_PUBLIC_EXPOSURE: ${NIE_PUBLIC_EXPOSURE:-false}
      NIE_LOG_LEVEL: ${NIE_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nie_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["edge"]
    depends_on:
      - app
    environment:
      NIE_API_TOKEN: ${NIE_API_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$NIE_API_TOKEN" ]; then
          echo "perfil edge recusado: defina NIE_API_TOKEN antes de publicar as portas 80 e 443" >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile
      target: backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NIE_DATABASE_URL: postgres://nie:${NIE_DB_PASSWORD:-nie}@postgres:5432/nie?sslmode=disable
      NIE_DATA_DIR: /data
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      NIE_BACKUP_KEEP_DAILY: ${NIE_BACKUP_KEEP_DAILY:-7}
      NIE_BACKUP_KEEP_WEEKLY: ${NIE_BACKUP_KEEP_WEEKLY:-4}
      NIE_BACKUP_KEEP_MONTHLY: ${NIE_BACKUP_KEEP_MONTHLY:-6}
    volumes:
      - nie_data:/data:ro
    restart: "no"

volumes:
  nie_pgdata:
  nie_data:
